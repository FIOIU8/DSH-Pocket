name: Android development build

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      runtime_arch:
        description: Runtime ABI for this development build
        required: true
        default: aarch64
        type: choice
        options:
          - aarch64
          - x86_64

permissions:
  contents: read
  # Needed by the lint SARIF upload step below.
  security-events: write

# Cancel superseded runs so rapid pushes do not queue parallel builds.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUNTIME_ARCH: ${{ inputs.runtime_arch || 'aarch64' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      # actions/checkout preserves the mode recorded in git. gradlew was
      # committed as 100644, so on the Linux runner it is not executable and
      # "./gradlew" dies with "Permission denied" (exit 126) before Gradle even
      # starts. chmod here so the build does not depend on the committed mode.
      - name: Make gradlew executable
        run: chmod +x gradlew

      # The configuration cache lives in the project's .gradle directory, which
      # actions/checkout wipes on every run. Restoring it lets Gradle reuse the
      # configuration phase ("Configuration cache entry reused") instead of
      # recalculating the task graph.
      - name: Cache Gradle configuration cache
        uses: actions/cache@v4
        with:
          path: .gradle/configuration-cache
          key: ${{ runner.os }}-gradle-config-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle.properties', 'build.gradle.kts', 'settings.gradle.kts', 'app/build.gradle.kts', 'gradle/libs.versions.toml') }}

      # cache: gradle persists the wrapper distribution and the dependency
      # cache under ~/.gradle between runs. Without it every run re-downloads
      # gradle-9.6.0-bin.zip (~130MB) and re-resolves all dependencies.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # setup-android@v3 shipped a default package list of "tools platform-tools".
      # The obsolete "tools" package is gone from the Google SDK repository, so
      # sdkmanager exits 1 with "Warning: Failed to find package 'tools'" and the
      # whole job dies before Gradle ever runs. v4 defaults to "platform-tools"
      # only; the platform and build-tools the build actually needs are listed
      # explicitly so the build does not depend on the runner image contents.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Create temporary debug signing key
        run: |
          mkdir -p .keystore
          keytool -genkeypair -v \
            -keystore .keystore/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Collect Android runtime
        run: |
          python tools/collect_runtime.py fetch --arch "$RUNTIME_ARCH" --work .runtime-work
          npm init -y --prefix .runtime-work/bundle
          npm install --prefix .runtime-work/bundle \
            --omit=dev --ignore-scripts --no-audit --no-fund \
            @deepseek-ai/dsh@0.2.0-rc.2
          # WebAssembly sharp: Android has no native prebuilt; the version must
          # track the sharp version the dsh install resolved to.
          npm install --prefix .runtime-work/bundle \
            --omit=dev --ignore-scripts --no-audit --no-fund \
            @img/sharp-wasm32@0.35.5
          python tools/collect_runtime.py pack \
            --arch "$RUNTIME_ARCH" \
            --work .runtime-work \
            --out ".runtime-work/runtime-$RUNTIME_ARCH.zip"
          cp ".runtime-work/runtime-$RUNTIME_ARCH.zip" app/src/main/assets/runtime.zip
          python tools/check_release_artifacts.py --runtime app/src/main/assets/runtime.zip --arch "$RUNTIME_ARCH"

      - name: Run tests, lint, and build arm64 APK
        run: >-
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
          -PappVersionCode=${GITHUB_RUN_NUMBER}
          -PappVersionName=0.0.${GITHUB_RUN_NUMBER}-ci
          -PruntimeArch=${RUNTIME_ARCH}

      # Kept even when the build step fails so failures come with test XML.
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-debug-${{ github.run_number }}
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      # Surfaces Android lint findings in the repository Security tab.
      # continue-on-error because SARIF upload needs GitHub Advanced Security
      # on private repositories; without it this step warns instead of failing.
      - name: Upload lint SARIF to code scanning
        if: always() && hashFiles('app/build/reports/lint-results-debug.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: app/build/reports/lint-results-debug.sarif

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: dsh-pocket-${{ env.RUNTIME_ARCH }}-ci-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
