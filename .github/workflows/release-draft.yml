name: Draft Android release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version and tag, for example v1.0.0
        required: true
        default: v1.0.0
        type: string
      dsh_offset:
        description: DSH release offset (blank or 0 = latest, -1 = previous, -2 = two back)
        required: false
        default: '0'
        type: string

permissions:
  contents: write
  # Needed by the lint SARIF upload step below.
  security-events: write

concurrency:
  group: android-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate release version
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like v1.0.0 (optionally with a prerelease suffix)." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag $RELEASE_VERSION already exists." >&2
            exit 1
          fi

      # gradlew is committed without the execute bit (mode 100644 in git), so
      # checkout on ubuntu-latest produces a non-executable file and
      # "./gradlew" fails with "Permission denied" (exit 126). chmod here.
      - name: Make gradlew executable
        run: chmod +x gradlew

      # The configuration cache lives in the project's .gradle directory, which
      # actions/checkout wipes on every run. Restoring it lets Gradle reuse the
      # configuration phase instead of recalculating the task graph.
      - name: Cache Gradle configuration cache
        uses: actions/cache@v4
        with:
          path: .gradle/configuration-cache
          key: ${{ runner.os }}-gradle-config-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle.properties', 'build.gradle.kts', 'settings.gradle.kts', 'app/build.gradle.kts', 'gradle/libs.versions.toml') }}

      # cache: gradle persists the wrapper distribution and the dependency
      # cache under ~/.gradle between runs. Without it every run re-downloads
      # gradle-9.6.0-bin.zip (~130MB) and re-resolves all dependencies.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Same fix as android-build.yml: setup-android@v3's default package list
      # contains the removed "tools" package, which fails sdkmanager and kills
      # the job before the release build starts.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Select official DSH release
        id: dsh
        env:
          GH_TOKEN: ${{ github.token }}
          DSH_OFFSET: ${{ inputs.dsh_offset }}
        run: python tools/select_dsh_release.py --output "$GITHUB_OUTPUT"

      - name: Verify DSH npm package exists
        env:
          DSH_VERSION: ${{ steps.dsh.outputs.version }}
        run: npm view "@deepseek-ai/dsh@$DSH_VERSION" version

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required repository Actions secret: $name" >&2
              exit 1
            fi
          done
          mkdir -p .keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .keystore/release.jks
          test -s .keystore/release.jks

      - name: Collect arm64 Android runtime
        env:
          DSH_VERSION: ${{ steps.dsh.outputs.version }}
        run: |
          python tools/collect_runtime.py fetch --arch aarch64 --work .runtime-work
          npm init -y --prefix .runtime-work/bundle
          npm install --prefix .runtime-work/bundle \
            --omit=dev --ignore-scripts --no-audit --no-fund \
            "@deepseek-ai/dsh@$DSH_VERSION"
          # WebAssembly sharp: Android has no native prebuilt; resolve the sharp
          # version the dsh install pulled in so the wasm binding matches it.
          SHARP_VERSION=$(node -p "require('./.runtime-work/bundle/node_modules/sharp/package.json').version")
          npm install --prefix .runtime-work/bundle \
            --omit=dev --ignore-scripts --no-audit --no-fund \
            "@img/sharp-wasm32@$SHARP_VERSION"
          python tools/collect_runtime.py pack \
            --arch aarch64 \
            --work .runtime-work \
            --out .runtime-work/runtime-aarch64.zip
          cp .runtime-work/runtime-aarch64.zip app/src/main/assets/runtime.zip

      # AGP 9 changed android.onlyEnableUnitTestForTheTestedBuildType to
      # default to true: unit-test components are only created for the tested
      # build type (debug), so :app:testReleaseUnitTest no longer exists and
      # requesting it fails with "Task not found". The unit tests are plain
      # JVM tests that do not exercise build-type-specific behavior, so the
      # debug component covers them; release-specific validation stays in
      # lintRelease/assembleRelease below.
      - name: Run tests, lint, and build signed arm64 APK
        env:
          ORG_GRADLE_PROJECT_releaseStoreFile: ${{ github.workspace }}/.keystore/release.jks
          ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease
          -PappVersionCode=${GITHUB_RUN_NUMBER}
          -PappVersionName=${RELEASE_VERSION#v}
          -PruntimeArch=aarch64

      # Kept even when the build step fails so failures come with test XML.
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-release-${{ github.run_number }}
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      # Surfaces Android lint findings in the repository Security tab.
      # continue-on-error because SARIF upload needs GitHub Advanced Security
      # on private repositories; without it this step warns instead of failing.
      - name: Upload lint SARIF to code scanning
        if: always() && hashFiles('app/build/reports/lint-results-release.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: app/build/reports/lint-results-release.sarif

      - name: Create draft release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          DSH_VERSION: ${{ steps.dsh.outputs.version }}
          DSH_RELEASE_TAG: ${{ steps.dsh.outputs.release_tag }}
          DSH_RELEASE_URL: ${{ steps.dsh.outputs.release_url }}
        run: |
          apk="DSH-Pocket-${RELEASE_VERSION}-DSH-${DSH_VERSION}-arm64.apk"
          notes="$RUNNER_TEMP/release-notes.md"
          generated_notes="$RUNNER_TEMP/generated-notes.md"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_VERSION" \
            -f target_commitish="$GITHUB_SHA" \
            --jq .body > "$generated_notes"
          {
            printf '## Included DSH release\n\n- Version: `v%s`\n- Official release: [%s](%s)\n\n---\n\n' \
              "$DSH_VERSION" "$DSH_RELEASE_TAG" "$DSH_RELEASE_URL"
            cat "$generated_notes"
          } > "$notes"
          gh release create "$RELEASE_VERSION" "$apk" \
            --draft \
            --title "DSH Pocket $RELEASE_VERSION (DSH v$DSH_VERSION)" \
            --notes-file "$notes"
